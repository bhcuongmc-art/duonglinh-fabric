
name: Build Fabric mod

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build mod
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build
          else
            echo "Khong tim thay gradlew trong repo"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: duonglinh-fabric-jar
          path: build/libs/*.jar
